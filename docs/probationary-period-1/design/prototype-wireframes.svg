<line x1="835" y1="140" x2="1565" y2="140" stroke="black" stroke-width="2"/>
<text x="859" y="190" font-family="Arial" font-size="27" font-weight="700">2  Review topic evidence</text>
<text x="860" y="242" font-family="Arial" font-size="22" font-weight="400">After the diagnostic, review each topic.</text>
