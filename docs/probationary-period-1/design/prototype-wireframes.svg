<text x="80" y="350" font-family="Arial" font-size="21" font-weight="400">Confirm the request in your own Telegram account.</text>
<rect x="60" y="420" width="340" height="50" fill="none" stroke="black" stroke-width="2"/>
<text x="75" y="453" font-family="Arial" font-size="21" font-weight="700">Continue in Telegram</text>
<text x="60" y="520" font-family="Arial" font-size="20" font-weight="400">Expired request? Generate a new linking request.</text>
<text x="60" y="562" font-family="Arial" font-size="20" font-weight="400">You can revoke the connection in account settings.</text>
<rect x="835" y="85" width="730" height="535" fill="none" stroke="black" stroke-width="2"/>
<text x="857" y="123" font-family="Arial" font-size="23" font-weight="700">AkadilEDU</text>
