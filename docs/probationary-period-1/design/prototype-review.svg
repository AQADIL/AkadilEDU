<text x="260" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="36" fill="#182D42" font-weight="650" text-anchor="start">Understand the mistake</text>
<text x="260" y="187" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#50647A" font-weight="400" text-anchor="start">Review the reasoning, then try a different question.</text>
<rect x="260" y="235" width="1120" height="580" rx="10" fill="white" stroke="#B8C7D6" stroke-width="1.8"/>
<text x="294" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#182D42" font-weight="650" text-anchor="start">Linear equations</text>
<text x="294" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#50647A" font-weight="400" text-anchor="start">Solve the equation</text>
<text x="294" y="394" font-family="Segoe UI, Arial, sans-serif" font-size="38" fill="#182D42" font-weight="650" text-anchor="start">3x + 6 = 21</text>
<path d="M294 430 H1346" fill="none" stroke="#B8C7D6" stroke-width="1"/>
<text x="294" y="476" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#19684F" font-weight="650" text-anchor="start">Correct solution</text>
<text x="294" y="526" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#182D42" font-weight="400" text-anchor="start">1. Subtract 6 from both sides.</text>
<text x="760" y="526" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#182D42" font-weight="600" text-anchor="start">3x = 15</text>
<text x="294" y="581" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#182D42" font-weight="400" text-anchor="start">2. Divide both sides by 3.</text>
<text x="760" y="581" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#182D42" font-weight="600" text-anchor="start">x = 5</text>
<text x="294" y="647" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#182D42" font-weight="650" text-anchor="start">Check</text>
<text x="294" y="691" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#50647A" font-weight="400" text-anchor="start">3 × 5 + 6 = 21. The solution satisfies the original equation.</text>
<path d="M294 726 H1346" fill="none" stroke="#B8C7D6" stroke-width="1"/>
<text x="294" y="772" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#50647A" font-weight="400" text-anchor="start">Next step: practise another equation with different numbers.</text>
